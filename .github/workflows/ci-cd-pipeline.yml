name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: npm install

    - name: Build Application
      run: npm run build

    - name: Run Tests
      run: npm test

  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
    - name: Deploy Application
      run: echo "Deployment successful"
